<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping | Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <div class="brand">
                <h1>Smart Shopping</h1>
                <p style="color: var(--text-muted); font-weight: 600; font-size: 0.9rem;">Tu asistente de compras profesional</p>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="icon-button" title="Cambiar Tema">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </header>

        <!-- Buscador y Quick Add -->
        <section class="toolbar-section">
            <div class="input-wrapper" style="flex: 2; min-width: 300px;">
                <i data-lucide="search" class="input-icon"></i>
                <input type="text" id="searchInput" placeholder="Filtrar por nombre, lugar o categoría...">
            </div>
            <button id="copyListButton" class="btn btn-success">
                <i data-lucide="whatsapp"></i>
                <span>Enviar WhatsApp</span>
            </button>
        </section>

        <div id="quick-add-container">
            <!-- Chips dinámicos -->
        </div>

        <!-- Formulario Pro -->
        <section class="input-section">
            <div class="input-grid">
                <div class="input-wrapper">
                    <i data-lucide="shopping-bag" class="input-icon"></i>
                    <input type="text" id="itemInput" placeholder="¿Qué llevamos hoy?">
                </div>
                <div class="input-wrapper">
                    <i data-lucide="hash" class="input-icon"></i>
                    <input type="number" id="quantityInput" placeholder="Cant." value="1">
                </div>
                <div class="input-wrapper">
                    <i data-lucide="dollar-sign" class="input-icon"></i>
                    <input type="number" id="unitPriceInput" placeholder="Precio Unit.">
                </div>
                <div class="input-wrapper">
                    <i data-lucide="tag" class="input-icon"></i>
                    <input type="text" id="categoryInput" placeholder="Categoría" list="category-suggestions">
                    <datalist id="category-suggestions"></datalist>
                </div>
            </div>
            <div class="bottom-row">
                <div class="input-wrapper">
                    <i data-lucide="map-pin" class="input-icon"></i>
                    <input type="text" id="locationInput" placeholder="Establecimiento / Supermercado" list="location-suggestions">
                    <datalist id="location-suggestions"></datalist>
                </div>
                <div class="input-wrapper">
                    <i data-lucide="edit-2" class="input-icon"></i>
                    <input type="text" id="observationsInput" placeholder="Notas adicionales">
                </div>
                <button id="addItemButton" class="btn btn-primary">
                    <i data-lucide="plus-circle"></i>
                    <span>Añadir a la lista</span>
                </button>
            </div>
        </section>

        <!-- Dashboard de Estadísticas -->
        <section class="summary-dashboard">
            <div class="stat-card">
                <span class="stat-label">Total Estimado</span>
                <span id="grandTotalValue" class="stat-value">$0.00</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Presupuesto</span>
                <input type="number" id="budgetInput" style="border: none; background: transparent; padding: 0; font-size: 1.2rem; font-weight: 800; color: var(--warning);" placeholder="0.00">
            </div>
            <div class="stat-card">
                <span class="stat-label">Progreso</span>
                <div class="progress-container" style="margin-top: 10px;">
                    <div id="budgetProgressBar" class="progress-bar"></div>
                </div>
                <span id="budgetStats" style="font-size: 0.75rem; font-weight: 700;"></span>
            </div>
        </section>

        <div class="toolbar-section">
            <div class="form-check" style="display: flex; align-items: center; gap: 10px; font-weight: 600;">
                <input type="checkbox" id="hideCompletedSwitch" style="width: 20px; height: 20px;">
                <label for="hideCompletedSwitch">Ocultar productos en el carrito</label>
            </div>
        </div>

        <!-- Lista de Compras -->
        <main id="shoppingListContainer">
            <!-- Items inyectados -->
        </main>

        <div id="grandTotalContainer" class="grand-total">
            Total Estimado: $0.00
        </div>

        <footer style="text-align: center; margin-top: 40px; padding-bottom: 20px;">
            <button id="resetListButton" class="btn btn-secondary" style="margin: 0 auto;">
                <i data-lucide="trash-2"></i>
                Limpiar lista completada
            </button>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
