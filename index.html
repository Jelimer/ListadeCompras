<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping | Lista de Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header class="header-row">
            <div class="brand">
                <h1>Smart Shopping</h1>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="icon-button" title="Cambiar Tema">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </header>

        <div class="toolbar-section">
            <div class="input-wrapper" style="flex: 1;">
                <i data-lucide="search" class="input-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar en la lista...">
            </div>
            <button id="copyListButton" class="btn btn-success">
                <i data-lucide="share-2"></i>
                <span>WhatsApp</span>
            </button>
        </div>

        <div id="quick-add-container" class="toolbar-section">
            <!-- Chips de agregado rápido -->
        </div>

        <section class="input-section glass">
            <div class="input-wrapper">
                <i data-lucide="package" class="input-icon"></i>
                <input type="text" id="itemInput" placeholder="¿Qué necesitas comprar?">
            </div>
            <div class="input-wrapper">
                <i data-lucide="hash" class="input-icon"></i>
                <input type="number" id="quantityInput" placeholder="Cantidad" value="1" min="1">
            </div>
            <div class="input-wrapper">
                <i data-lucide="dollar-sign" class="input-icon"></i>
                <input type="number" id="unitPriceInput" placeholder="Precio Unitario" step="0.01">
            </div>
            <div class="input-wrapper">
                <i data-lucide="map-pin" class="input-icon"></i>
                <input type="text" id="locationInput" placeholder="Lugar de compra" list="location-suggestions">
                <datalist id="location-suggestions"></datalist>
            </div>
            <div class="input-wrapper">
                <i data-lucide="tag" class="input-icon"></i>
                <input type="text" id="categoryInput" placeholder="Categoría" list="category-suggestions">
                <datalist id="category-suggestions"></datalist>
            </div>
            <div class="input-wrapper">
                <i data-lucide="edit-3" class="input-icon"></i>
                <input type="text" id="observationsInput" placeholder="Observaciones">
            </div>
            <button id="addItemButton" class="btn btn-primary">
                <i data-lucide="plus"></i>
                <span>Añadir Producto</span>
            </button>
        </section>

        <section class="budget-section">
            <div class="budget-header">
                <div class="budget-input-group">
                    <label>Presupuesto:</label>
                    <input type="number" id="budgetInput" placeholder="0.00">
                </div>
                <div class="form-switch">
                    <input type="checkbox" id="hideCompletedSwitch">
                    <label for="hideCompletedSwitch">Ocultar listos</label>
                </div>
            </div>
            <div class="progress-container">
                <div id="budgetProgressBar" class="progress-bar"></div>
            </div>
            <div id="budgetStats" class="budget-stats">Restante: $0.00</div>
        </section>

        <div id="summary-dashboard" class="summary-dashboard">
            <!-- Totales por categorías se inyectan aquí -->
        </div>

        <main id="shoppingListContainer">
            <!-- Los items agrupados se inyectan aquí -->
        </main>

        <div id="grandTotalContainer" class="grand-total">
            Total Estimado: $0.00
        </div>

        <footer>
            <div class="footer-actions">
                <button id="resetListButton" class="btn btn-secondary">
                    <i data-lucide="refresh-cw"></i>
                    Reiniciar Lista
                </button>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
