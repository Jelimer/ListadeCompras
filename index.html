<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compra | PRO</title>
    <meta name="description" content="Gestión avanzada de suministros, rutas de compra optimizadas y análisis financiero.">
    <meta property="og:title" content="Lista de Compra | PRO">
    <meta property="og:description" content="Gestión avanzada de suministros, rutas de compra optimizadas y análisis financiero.">

    <!-- Metadatos y Enlaces PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Anti-FOUC y registro de Service Worker PWA -->
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme');
                var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var initialTheme = (savedTheme === 'dark' || savedTheme === 'light') 
                    ? savedTheme 
                    : (systemPrefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', initialTheme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();

        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function (error) {
                    console.error('Error al registrar Service Worker:', error);
                });
            });
        }
    </script>

    <!-- Fuentes Tipográficas Ejecutivas (Plus Jakarta Sans + JetBrains Mono Tabular) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
